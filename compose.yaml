services:
  nats:
    # Та же версия, что в CI и на проде (deploy/nats/Dockerfile): локальный
    # стек не должен вести себя иначе, чем брокер, на котором проверяется
    # и работает доставка.
    image: nats:2.12.6-alpine
    command:
      # Конфиг прода ради max_payload: дефолтный 1 MiB уже потолка кадра
      # ноды, и крупный кадр локально рвал бы соединение с брокером —
      # поломка, которой на проде нет. Разбор значения — в самом nats.conf.
      - "-c"
      - "/etc/nats/nats.conf"
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - nats
    environment:
      # Ключ ноды генерируется при первом старте в STORAGE_PATH и печатается
      # в лог как node_key=... — клиенту он нужен до подключения (Noise IK).
      BIND_HOST: 0.0.0.0
      BIND_PORT: 5000
      STORAGE_PATH: /srv/trust-message/data
      METRICS_ENABLED: "true"
      METRICS_ADDR: 0.0.0.0:9000
      DELIVERY_BACKEND: jetstream
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: messages
      NATS_ACK_WAIT_SECS: 30
      NATS_PUBLISH_TIMEOUT_MS: 2000
    ports:
      - "5000:5000"
      # Метрики — только с этой машины: аутентификации у экспортера нет, а
      # отдаёт он нагрузку и внутреннее состояние ноды.
      - "127.0.0.1:9000:9000"
    volumes:
      - message-data:/srv/trust-message/data

volumes:
  nats-data:
  message-data:
