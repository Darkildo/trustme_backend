# Конфигурация брокера. Существует ради одной опции: max_payload задаётся
# только файлом — флага командной строки у nats-server для неё нет.
#
# Дефолт 1 MiB уже потолка кадра ноды (MAX_FRAME_LEN, 8 MiB): кусок медиа
# в 1 MiB с конвертом его превышает, брокер отвечает `Maximum Payload
# Violation` и рвёт соединение, а нода по таймауту публикации отказывает
# отправителю.
#
# 16 MiB выбраны так, чтобы брокер заведомо не был узким местом: всё, что
# нода приняла кадром, он обязан принять публикацией. Узкое место должно
# быть ровно одно, и оно — MAX_FRAME_LEN, потому что о нём нода сообщает
# клиенту в подписанном снапшоте конфигурации, а о лимитах брокера — нет.
max_payload: 16MB
