services:
  nats:
    build:
      context: ./tcp_message_server/deploy/nats
      dockerfile: Dockerfile
    image: trust-nats:jetstream
    container_name: nats
    command:
      # `-c` нужен ради max_payload: у неё нет флага командной строки,
      # задать её можно только файлом. Остальное оставлено флагами —
      # они перекрывают конфиг, и хранить два места для одного и того же
      # незачем. Разбор причины и выбранного значения — в самом nats.conf.
      - "nats-server"
      - "-c"
      - "/etc/nats/nats.conf"
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
      - ./tcp_message_server/deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - grpc-network
    restart: unless-stopped
    # Логи без лимита — это медленная течь, которая однажды съедает диск.
    # json-file по умолчанию не ротируется вовсе.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Машина с ~1 ГБ RAM: без лимитов OOM-killer выбирает жертву сам, и это
    # с равной вероятностью нода, брокер или prometheus. С лимитами первым
    # под нож идёт тот, кто действительно потёк.
    mem_limit: 256m
    # Готовность = отвечает /healthz, а не «контейнер запущен». Без этого
    # нода стартует раньше брокера, падает на `failed to connect to NATS` и
    # поднимается только рестарт-политикой — с всплеском ошибок в логе и
    # лишними секундами недоступности при каждом перезапуске стека.
    #
    # curl/wget в debian-slim нет, поэтому HTTP-запрос делается bash'ем
    # через /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8222 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Внешний auth-сервис в тракте сообщений не участвует: identity клиента
  # доказывает статик Noise-сессии, токенов в протоколе v1 нет. Сервис
  # описан в базовом compose, но по умолчанию не поднимается — только
  # профилем: `docker compose --profile legacy-auth up -d auth`.
  auth:
    profiles:
      - legacy-auth

  # Тот же приём, что и у message: prometheus в базовом compose ждёт auth,
  # а выключенный профилем сервис иначе делает проект невалидным.
  prometheus:
    depends_on:
      message:
        condition: service_started
      auth:
        condition: service_started
        required: false
    # Правила лежат отдельным каталогом: базовый compose монтирует только
    # сам prometheus.yml, а без файлов правил секция `rule_files` в нём
    # указывала бы в пустоту.
    volumes:
      - ./monitoring:/etc/prometheus/rules:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m

  # Метрики железа: диск, память, swap. Без него у ноды нет ни одного
  # числа о машине, на которой она стоит.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.vmstat
      - --collector.loadavg
      - --collector.cpu
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - grpc-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    mem_limit: 64m

  # Маршрутизация алертов. Канал доставки задаётся ALERT_WEBHOOK_URL в
  # .env; без него алерты вычисляются и видны в UI, но никого не будят —
  # см. monitoring/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - grpc-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    mem_limit: 96m

  message:
    build:
      context: ./tcp_message_server/deploy/message-runtime
      dockerfile: Dockerfile
    image: trust-message-service:jetstream
    depends_on:
      nats:
        condition: service_healthy
      # Сервис выключен профилем; `required: false` не даёт ему стать
      # обязательным условием старта ноды.
      auth:
        condition: service_started
        required: false
    environment:
      # Ed25519-seed ноды (64 hex). Живёт в .env рядом с compose на хосте,
      # в дерево деплоя не попадает (rsync его исключает). Форма `:?` —
      # намеренно: без ключа нода сгенерировала бы новый и молча отрезала
      # всех клиентов, поэтому деплой обязан упасть здесь, а не там.
      NODE_IDENTITY_KEY: ${NODE_IDENTITY_KEY:?set NODE_IDENTITY_KEY in .env next to compose}
      DELIVERY_BACKEND: jetstream
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: messages
      # 1 GiB на весь поток при кусках медиа по 512 KiB — это ~2048
      # записей, то есть около 20 одновременных передач по 50 МБ,
      # ждущих офлайн-получателя. Потолок важен тем, что политика
      # потока — discard: old: переполнение молча выбрасывает самые
      # старые записи, включая недоставленные.
      #
      # Верхняя граница здесь — не протокол, а диск: поток лежит в
      # томе nats-data на том же разделе, что данные ноды и бэкапы.
      # Поднимать дальше можно только вместе со свободным местом.
      NATS_STREAM_MAX_BYTES: 1073741824
      NATS_ACK_WAIT_SECS: 30
      NATS_PUBLISH_TIMEOUT_MS: 2000
      # Лимиты отправки подняты под передачу медиа: клиент режет файл на
      # куски (в потоке средний размер записи ~24 KiB), и файл в десятки
      # мегабайт — это сотни отправок подряд. Дефолтные 100 msg/s отбивали
      # их частью, а клиент читал отказ как обрыв и переподключался.
      RATE_LIMIT_SEND_MSGS_PER_SEC: 160
      # 16 GiB/сутки на пользователя. Выше потолка самого потока JetStream
      # (NATS_STREAM_MAX_BYTES выше) — то есть суточный бюджет перестаёт
      # быть ограничителем, и реальную границу держит поток.
      RATE_LIMIT_SEND_BYTES_PER_DAY: 17179869184
      # FCM push: service account JSON is copied to /root/trust/secrets/ on
      # the host out-of-band (excluded from rsync to keep it out of the deploy
      # tree). Mounted read-only into the container at /secrets/fcm-sa.json.
      PUSH_ENABLED: "true"
      # Профиль пробуждения этого развёртывания. HIGH будит мгновенно
      # (звонки и всё срочное), остальные — реже дефолтов, а сообщения без
      # приоритета не будят вовсе: они копятся и уезжают вместе с первым
      # приоритетным либо ждут, пока клиент подключится сам.
      PUSH_MIN_GAP_MEDIUM_MS: 60000
      PUSH_MIN_GAP_LOW_MS: 180000
      PUSH_WAKE_ON_UNSPECIFIED: "false"
      # Burst обходит интервал: столько накопленных сообщений будят
      # досрочно. Для неприоритетных это единственный способ разбудить
      # вообще — интервала у них нет.
      PUSH_BURST_MEDIUM: 10
      PUSH_BURST_LOW: 20
      PUSH_BURST_NONE: 100
      # Идентификаторы аккаунтов Firebase/Apple берутся из .env рядом с
      # compose, как и NODE_IDENTITY_KEY: в репозитории их нет.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:?set FCM_PROJECT_ID in .env next to compose}
      FCM_SERVICE_ACCOUNT_PATH: /secrets/fcm-sa.json
      # APNs voip (iOS CallKit ring): ключ .p8 лежит в /root/trust/secrets/
      # на хосте (вне deploy-дерева, как fcm-sa.json); APNS_KEY_PATH — путь
      # к нему внутри контейнера, /secrets/<файл>.p8. production — токены
      # sandbox-сборок (dev/profile) этим эндпоинтом не обслуживаются.
      APNS_ENABLED: "true"
      APNS_KEY_PATH: ${APNS_KEY_PATH:?set APNS_KEY_PATH in .env next to compose}
      APNS_KEY_ID: ${APNS_KEY_ID:?set APNS_KEY_ID in .env next to compose}
      APNS_TEAM_ID: ${APNS_TEAM_ID:?set APNS_TEAM_ID in .env next to compose}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:?set APNS_BUNDLE_ID in .env next to compose}
      APNS_ENVIRONMENT: production
    volumes:
      - /root/trust/secrets:/secrets:ro
    # Живость ноды = отвечает экспортер метрик. Слушающий TCP-порт 18081
    # проверять бесполезно: он остаётся открытым и у зависшего процесса,
    # потому что accept делает ядро. `/metrics` же отдаёт рантайм, и его
    # молчание означает, что молчит нода.
    #
    # curl/wget в debian-slim нет, поэтому запрос делается bash'ем через
    # /dev/tcp — тем же приёмом, что и у nats.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /metrics HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Штатной остановке нужно время: нода сбрасывает sled на диск, и
    # дефолтных десяти секунд может не хватить на большой базе.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Лимит нужен не только против OOM: sled берёт размер своего кэша из
    # cgroup-лимита, и без него он считает своей всю память машины.
    mem_limit: 384m

volumes:
  nats-data:
  alertmanager-data:
