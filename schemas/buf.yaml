# Модуль buf для wire-схем ноды. Корень модуля — `schemas/`, поэтому пути
# импорта совпадают с package: `trustmessage/wire/v1/wire.proto`.
#
# `buf lint` держит стиль схемы (обязательный `_UNSPECIFIED = 0`, префиксы
# значений enum, соответствие package каталогу), `buf breaking` сравнивает
# схему с целевой веткой PR: поле, переиспользовавшее номер, ломает
# клиентов молча — CI обязан ловить это до мерджа (см. .github/workflows).
version: v2
modules:
  - path: .
lint:
  use:
    - DEFAULT
breaking:
  # WIRE_JSON, а не FILE: наше правило — «номер поля не переиспользуется
  # никогда, удалённое поле уходит в reserved». FILE запрещает удаление
  # даже с reserved, то есть строже собственного контракта; WIRE_JSON
  # проверяет ровно то, что мы обещали клиентам.
  use:
    - WIRE_JSON
