// Wire-протокол клиент ↔ нода. Кадры едут внутри установленного
// Noise-канала (`Noise_IK_25519_ChaChaPoly_BLAKE2s`, при первом контакте —
// `Noise_XX_25519_ChaChaPoly_BLAKE2s`), поэтому шифрования и
// аутентификации на этом уровне нет: их даёт канал, а identity клиента
// доказана его статиком (см. src/net/noise.rs).
//
// Правила эволюции схемы:
//   * номер поля не переиспользуется: удалённые поля уходят в `reserved`,
//     иначе старый клиент прочитает чужие байты как своё поле;
//   * zero-значение неотличимо от отсутствия поля (свойство proto3), поэтому
//     значение по умолчанию у нового поля обязано быть осмысленным;
//   * `_UNSPECIFIED = 0` у каждого enum — незнакомое значение от более
//     свежей стороны декодируется в него, а не в ошибку кадра.
//
// Версия протокола передаётся открытым текстом в начале соединения и входит
// в prologue Noise-хендшейка: нода, не поддерживающая заявленную версию,
// рвёт соединение до хендшейка, и несовместимая пара «клиент × нода» не
// доходит до обмена кадрами, которые не сможет разобрать.

syntax = "proto3";

package trustmessage.wire.v1;

// Приоритет сообщения. `UNSPECIFIED` = отправитель приоритет не указал:
// сервер обращается с таким конвертом как с обычным (коалесинг пушей по
// none-политике). Номера совпадают с байтом приоритета в sled-хранилище.
enum MessagePriority {
  MESSAGE_PRIORITY_UNSPECIFIED = 0;
  MESSAGE_PRIORITY_LOW = 1;
  MESSAGE_PRIORITY_MEDIUM = 2;
  MESSAGE_PRIORITY_HIGH = 3;
}

// Пометка «этот конверт начинает входящий звонок». Клиент-отправитель
// ставит её только на WebRTC OFFER (plaintext видит он, а не нода);
// answer/ICE/hangup/invite остаются `UNSPECIFIED`. По этому маркеру нода
// будит офлайн-получателя APNs voip-пушем мимо коалесинга, если у
// устройства зарегистрирован voip-токен; иначе — FCM-wake с признаком
// звонка.
enum WakeHint {
  // Обычное сообщение. Это же значение приходит от клиентов, не знающих
  // про wake-подсказки.
  WAKE_HINT_UNSPECIFIED = 0;
  WAKE_HINT_INCOMING_CALL = 1;
}

// Режим retention-политики ноды. `UNSPECIFIED` на проводе означает, что
// сервер политику не сообщил — клиент обязан читать это как `DISABLED`
// («хранения нет»), а не как «хранение вечное».
enum RetentionMode {
  RETENTION_MODE_UNSPECIFIED = 0;
  RETENTION_MODE_DISABLED = 1;
  RETENTION_MODE_IMMEDIATE = 2;
  RETENTION_MODE_KEEP_FOR = 3;
}

// Причина отказа отправки, уточняющая `ok = false` в SendAck.
//
// Правило совместимости: `UNSPECIFIED` неотличим от отсутствия поля,
// поэтому пара `ok = false, reason = UNSPECIFIED` обязана читаться как
// родовой отказ. Клиент не должен завязывать логику на reason, кроме
// диагностики и стратегии ретраев.
enum SendRejectReason {
  SEND_REJECT_REASON_UNSPECIFIED = 0;
  // Очередь получателя упёрлась в квоту.
  SEND_REJECT_REASON_FULL = 1;
  // Нет права на депозит. Нода отвечает им, когда адресация по очередям
  // включена, на отправку в неизвестную, отозванную или истёкшую очередь
  // и на кадр, адресованный по `recipient_id` аккаунту в режиме «только по очередям»
  // (SetQueueOnly). Повтор того же кадра бесполезен: нужен актуальный
  // `queue_id` от контакта.
  SEND_REJECT_REASON_NO_PERMIT = 2;
  // ttl истёк к моменту приёма. Зарезервировано: сейчас нода это значение
  // не выдаёт.
  SEND_REJECT_REASON_EXPIRED = 3;
  // Превышен rate-limit msg/s или байт/сутки.
  SEND_REJECT_REASON_RATE_LIMITED = 4;
  // Ненулевой ttl ниже пола ноды.
  SEND_REJECT_REASON_INVALID_TTL = 5;
  // Ошибка ноды: хранилище, брокер, внутренняя ошибка. Отправитель ни при
  // чём; немедленный повтор бесполезен, повтор через паузу осмыслен.
  SEND_REJECT_REASON_INTERNAL = 6;
  // Сессия вошла по сертификату устройства, в области действия которого
  // нет отправки. Повтор тем же соединением бесполезен.
  SEND_REJECT_REASON_FORBIDDEN = 7;
  // Тело длиннее, чем нода может доставить: `IncomingMessage` с ним не
  // уложился бы в `max_frame_len`. Потолок тела — `max_frame_len` минус
  // 128 байт запаса под служебные поля кадра. Повтор того же кадра
  // бесполезен: тело нужно резать.
  SEND_REJECT_REASON_TOO_LARGE = 8;
}

// Причина отказа в операции над очередью.
//
// `NOT_FOUND` намеренно покрывает и «такой очереди нет», и «очередь есть,
// но чужая». Различать их нельзя: знание `queue_id` — это capability на
// депозит, и ответ, подтверждающий существование чужой очереди, превращает
// `RevokeQueue` в оракул для перебора.
enum QueueRejectReason {
  QUEUE_REJECT_REASON_UNSPECIFIED = 0;
  // Достигнут потолок очередей на пользователя.
  QUEUE_REJECT_REASON_LIMIT = 1;
  // Очереди нет либо она принадлежит не этому пользователю.
  QUEUE_REJECT_REASON_NOT_FOUND = 2;
  // Ошибка ноды: хранилище, внутренняя ошибка.
  QUEUE_REJECT_REASON_INTERNAL = 3;
  // Сессия вошла по сертификату устройства без права управлять очередями,
  // или операция требует сессии, вошедшей ключом аккаунта
  // (RevokeDeviceCerts).
  QUEUE_REJECT_REASON_FORBIDDEN = 4;
  // Нода не поддерживает операцию в текущей конфигурации (например,
  // SetQueueOnly при выключенной адресации по очередям).
  QUEUE_REJECT_REASON_UNSUPPORTED = 5;
  // Параметры запроса негодны: длина тега, срок в прошлом, надгробие без
  // тега, запись аккаунта длиннее 4 КиБ.
  QUEUE_REJECT_REASON_INVALID = 6;
  // Очередь с этим id отозвана или истекла (надгробие) и заново не
  // выделяется.
  QUEUE_REJECT_REASON_REVOKED = 7;
  // Версия записи аккаунта не совпала с `SetAccountRecord.expected_version`.
  QUEUE_REJECT_REASON_CONFLICT = 8;
  // Превышен лимит управляющих кадров очередей на соединение
  // (LIMIT_CONTROL_PER_SEC). Повтор через секунду осмыслен.
  QUEUE_REJECT_REASON_RATE_LIMITED = 9;
}

// Платформа устройства, зарегистрировавшего push-токен.
//
// `IOS_VOIP` — отдельный PushKit VoIP-токен iOS-устройства (не равен
// APNs/FCM-токену того же устройства): регистрируется второй регистрацией с
// тем же device_id, живёт в отдельном слоте реестра и доставляется напрямую
// через APNs (`apns-push-type: voip`), минуя FCM.
enum PushPlatform {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  PUSH_PLATFORM_ANDROID_FCM = 1;
  PUSH_PLATFORM_IOS_FCM = 2;
  PUSH_PLATFORM_IOS_VOIP = 3;
}

message RetentionConfig {
  RetentionMode mode = 1;
  // Осмысленно только при `mode = KEEP_FOR`; в остальных режимах 0.
  uint64 retention_seconds = 2;
}

// Нода → клиент: сессия установлена. Приходит не в ответ на запрос, а сразу
// после Noise-хендшейка: identity клиента к этому моменту уже доказана.
message AuthOk {
  // 32 байта Ed25519 pk аккаунта. При входе без сертификата устройства
  // статик Noise-сессии — его X25519-конверсия.
  bytes user_id = 1;
  uint64 server_time = 2;
}

// Нода → клиент: сессия закрывается. Приходит по установленному
// Noise-каналу: ошибки самого хендшейка канала не имеют и выражаются его
// разрывом. Может прийти и посреди живой сессии — например, когда умер
// обслуживавший её пул доставки.
message AuthError {
  // Код в стиле HTTP:
  //   * 401 — лимит одновременных сессий;
  //   * 403 — вход по этому сертификату устройства запрещён навсегда: он
  //     отозван (RevokeDeviceCerts). Приходит вместо AuthOk, при
  //     подтверждении сессии или посреди живой сессии. Повтор с тем же
  //     сертификатом бессмыслен;
  //   * 503 — нода временно не может обслуживать сессию (доставка или
  //     хранилище).
  uint32 code = 1;
  string message = 2;
}

// Клиент → нода: отправить сообщение.
message ClientSend {
  // 32 байта Ed25519 pk получателя. Может быть пустым, если получателя
  // определяет `queue_id` (см. ниже).
  bytes recipient_id = 1;
  // E2E-шифротекст: нода в него не смотрит.
  bytes body = 2;
  // Адресация конкретного устройства получателя. Отсутствие = account-scope
  // (всем устройствам). Значение обязано влезать в uint16: бо́льший
  // device_id — ошибка кадра, нода закрывает сессию.
  optional uint32 recipient_device_id = 3;
  MessagePriority priority = 4;
  WakeHint wake_hint = 5;

  // --- Node-header конверта v3: поля, которые нода читает (в отличие от
  // E2E-шифротекста `body`). ---

  // Идентификатор mailbox-очереди получателя (32 байта, выдаётся нодой в
  // ответ на AllocateQueue). Обработка зависит от
  // `ServerConfig.supports_queue_addressing`:
  //   * флаг снят — поле игнорируется, получатель определяется
  //     `recipient_id`;
  //   * флаг поднят — получатель определяется владельцем очереди:
  //     непустой `recipient_id` обязан совпадать с владельцем, иначе
  //     NO_PERMIT (N-8). Пустой recipient_id допустим.
  //     `recipient_device_id` сохраняется:
  //     есть значение — доставка только этому устройству владельца
  //     очереди, нет — во все его устройства (account-scope), как и при
  //     адресации по `recipient_id` (`ServerConfig.
  //     supports_queue_device_scope`). На неизвестную, отозванную или
  //     истёкшую очередь нода отвечает SendAck с `reason = NO_PERMIT`, без
  //     отката к `recipient_id`.
  // Пустое значение и значение неверной длины считаются отсутствующими.
  bytes queue_id = 6;
  // Максимальное время жизни сообщения в очереди, секунды от приёма нодой;
  // выставляет отправитель. 0 = не указан: действует только
  // retention-политика ноды. Ненулевой ttl ниже пола ноды (по умолчанию
  // 24 ч) отвергается с `INVALID_TTL`.
  //
  // Применение зависит от бэкенда доставки. Прямой (sled) удаляет
  // истёкшее сообщение сам — лениво при чтении очереди и фоновой чисткой;
  // это удаление по сроку, а не вытеснение при переполнении. Брокерный
  // (JetStream) переносит значение в конверте, но не применяет: срок
  // хранения там ограничен `max_age` потока.
  uint64 ttl_seconds = 7;
}

// Нода → клиент: судьба отправленного конверта. Смысл флагов зависит от
// бэкенда доставки:
//
//   * `ok = true, queued = true` — брокерный бэкенд: опубликовано в поток,
//     `queue_id` = `message_id` конверта;
//   * `ok = true, queued = false` — прямой бэкенд: уведомление принято
//     живой сессией получателя; `queue_id` — `message_id` записи в очереди
//     (0, если хранение выключено);
//   * `ok = false, queued = true` — прямой бэкенд: положено в очередь,
//     `queue_id` — `message_id` записи в ней;
//   * `ok = false, queued = false` — не принято, см. `reason`.
//
// `queue_id` здесь — идентификатор принятого конверта, с mailbox-очередью
// `ClientSend.queue_id` он не связан.
message SendAck {
  bool ok = 1;
  bool queued = 2;
  uint64 queue_id = 3;
  SendRejectReason reason = 4;
}

// Клиент → нода: подтверждение получения конверта (at-least-once). Без
// него конверт выдаётся снова: брокерным бэкендом — по ack-таймауту
// потока, прямым (с 0.4.0) — по `SLED_ACK_WAIT_SECS` и следующей сессии.
message DeliveryAck {
  uint64 message_id = 1;
}

// Нода → клиент: входящее сообщение.
message IncomingMessage {
  // Mailbox capability actually used at deposit. Empty for recipientId
  // addressing and for legacy records without provenance. Never copied from
  // an ignored/unresolved ClientSend.queue_id (N-8).
  bytes queue_id = 6;
  bytes from_user_id = 1;
  bytes body = 2;
  optional uint32 from_device_id = 3;
  // Идентификатор конверта у этой ноды. Годится для DeliveryAck и для
  // отсева повторной выдачи того же конверта. Повторная отправка того же
  // сообщения — другой конверт: и message_id, и шифротекст будут иными
  // (nonce не повторяется), поэтому её ловит только идентификатор внутри
  // E2E-конверта. См. server-contract.md, «Дедупликация входящих».
  //
  // 0 только на прямом (sled) бэкенде с выключенным хранением
  // (`offline_messages_retention = immediate`) и у нод до 0.4.0 при
  // доставке в живую сессию: подтверждать нечего. Флага «повторная выдача»
  // нет — повтор узнаётся по этому идентификатору.
  uint64 message_id = 4;
  // Переслан из ClientSend.
  MessagePriority priority = 5;
}

// Payload хендшейка с identity клиента: первого сообщения в IK, третьего
// в XX (в XX клиент раскрывает статик только в msg3). Едет внутри
// хендшейка, а не как Frame: до его проверки сессии ещё нет.
// `identity_key` — заявка: нода сверяет его X25519-конверсию с
// аутентифицированным статиком соединения, несовпадение рвёт хендшейк.
message NoiseClientHello {
  // 32 байта Ed25519 pk — он же user_id.
  bytes identity_key = 1;
  optional uint32 device_id = 2;
  // Делегированный вход. Если поле есть, статик соединения сверяется не с
  // конверсией `identity_key`, а с `device_cert.transport_key`, и нода
  // проверяет подпись сертификата ключом `identity_key`. `device_id` тогда
  // обязателен: сертификат выписан на конкретное устройство. При неудачной
  // проверке сертификата отката к прямой сверке нет.
  optional DeviceCertificate device_cert = 3;
  // Роль сессии (server-contract.md, §6.11). Лежит здесь, а не в открытом
  // прологе: payload хендшейка зашифрован и входит в transcript, поэтому
  // подменить роль на проводе нельзя. Незнакомое значение — отказ
  // хендшейка: нода не может обслужить роль, о которой не знает.
  SessionRole role = 4;
}

// Роль Noise-сессии.
enum SessionRole {
  // Сессия сообщений: доставка, отправка, очереди, push-токены. Это же
  // значение приходит от клиентов, не знающих про роли.
  SESSION_ROLE_UNSPECIFIED = 0;
  // Сессия передачи файлов (server-contract.md, §6.11): кадры хранилища,
  // Ping и GetServerConfig. Для доставки не регистрируется, входящих не
  // получает, «в сети» для пушей не делает и в `max_sessions_per_user` не
  // считается — у неё свой потолок.
  SESSION_ROLE_BLOB = 1;
}

// Сертификат устройства: ключ аккаунта поручает отдельной X25519-паре
// держать сессию от его имени — с ограниченными правами и сроком.
//
// Назначение: фоновому процессу клиента (приём пушей, звонок с
// заблокированного экрана) нужно соединение с нодой, когда ключ аккаунта
// закрыт PIN-ом. Без сертификата ему пришлось бы хранить сам ключ аккаунта
// вне PIN-защиты; с сертификатом утечка фонового хранилища отдаёт ключ,
// который истекает сам и ничего не может подписать от имени аккаунта.
//
// Ключ аккаунта (`identity_key`) подписывает байты (все числа
// little-endian):
//   "trustmessage/device-cert/v1" || identity_key(32) || device_id(u32)
//   || transport_key(32) || signing_key(32) || scope(u32)
//   || not_before(u64) || not_after(u64)
//
// `identity_key` входит в подписываемые байты, но полем сертификата не
// является: проверяющий подставляет его сам (нода — из hello, собеседник —
// из адреса отправителя), а брать его из самого сертификата значило бы
// верить заявке. Подписываются эти байты, а не сериализованное сообщение:
// у protobuf нет канонической сериализации.
message DeviceCertificate {
  // X25519 public key (32 байта) — статик, которым устройство проходит Noise.
  bytes transport_key = 1;
  // Ed25519 public key (32 байта) устройства для подписей прикладного
  // уровня (сигналы звонка). Нода его не использует, но он под подписью:
  // собеседник проверяет ту же цепочку тем же сертификатом.
  bytes signing_key = 2;
  // Битовая маска прав, см. DeviceCertScope. Приём, DeliveryAck, Ping и
  // GetServerConfig доступны любой сессии; биты только добавляют права.
  // Неизвестные биты нода игнорирует.
  uint32 scope = 3;
  // Unix-секунды. Нода отвергает сертификат вне окна действия (для
  // `not_before` допускается расхождение часов до 300 с) и сертификат со
  // сроком жизни длиннее своего потолка (`ServerConfig.
  // device_cert_max_ttl_secs`). Кроме срока, украденный сертификат
  // ограничивает отзыв: RevokeDeviceCerts закрывает вход устройства по
  // сертификатам с `not_before` раньше заданного момента.
  uint64 not_before = 4;
  uint64 not_after = 5;
  // Ed25519-подпись ключом `identity_key` над байтами, описанными выше
  // (64 байта).
  bytes signature = 6;
  // Устройство, которому выписан сертификат. Нода требует совпадения с
  // `NoiseClientHello.device_id`. Лежит в сертификате, а не только в hello,
  // чтобы сертификат был самодостаточен: собеседник проверяет ту же
  // подпись, не видя хендшейка.
  uint32 device_id = 7;
}

// Биты `DeviceCertificate.scope`.
enum DeviceCertScope {
  DEVICE_CERT_SCOPE_UNSPECIFIED = 0;
  // ClientSend.
  DEVICE_CERT_SCOPE_SEND = 1;
  // RegisterPushToken / UnregisterPushToken.
  DEVICE_CERT_SCOPE_PUSH_TOKENS = 2;
  // AllocateQueue / RevokeQueue / ListQueues / SetQueueOnly /
  // SetAccountRecord.
  DEVICE_CERT_SCOPE_QUEUES = 4;
  // Прикладной бит: `signing_key` вправе подписывать сигналы звонка от
  // имени аккаунта. Нода его не читает — проверяет собеседник.
  DEVICE_CERT_SCOPE_CALL_SIGNALS = 8;
}

// Клиент → нода: запрос capability/config-снапшота. Вызывается внутри
// установленной сессии — pre-auth plaintext-пути не существует.
message GetServerConfig {}

// Клиент → нода: зарегистрировать push-токен текущего устройства. Сессия
// обязана иметь device_id — без него токен невозможно адресовать, и нода
// ответит PushTokenAck с ошибкой.
message RegisterPushToken {
  // Registration token, выданный FCM SDK (или PushKit — для IOS_VOIP).
  string token = 1;
  PushPlatform platform = 2;
}

// Клиент → нода: снять регистрацию push-токенов текущего устройства
// (логаут, ротация токена, отключение пушей пользователем). Снимает оба
// слота устройства — alert и voip.
message UnregisterPushToken {}

message PushTokenAck {
  bool ok = 1;
  string message = 2;
}

// Нода → клиент: снапшот возможностей и политик ноды.
message ServerConfig {
  uint32 proto_version = 1;
  uint64 max_frame_len = 2;
  bool supports_device_addressing = 3;
  bool supports_offline_messages = 4;
  bool supports_deleted_message_archive = 5;
  RetentionConfig offline_messages_retention = 6;
  RetentionConfig deleted_messages_retention = 7;
  // Нода ждёт DeliveryAck на каждый IncomingMessage с ненулевым
  // message_id: брокерный бэкенд и прямой с хранением (с 0.4.0).
  bool supports_delivery_ack = 8;
  // Статик ноды (X25519, 32 байта), с которым клиент прошёл
  // Noise-хендшейк. Повторяется здесь, чтобы оказаться под подписью:
  // клиент сверяет его со статиком хендшейка.
  bytes node_static_key = 12;

  // Identity-ключ ноды (Ed25519, 32 байта) — тот, которым подписан этот
  // снапшот. Клиент обязан проверить, что его birational-конверсия в
  // X25519 равна `node_static_key`: без этой проверки подпись доказывает
  // лишь «кто-то подписал», а не «подписала та нода, с которой я говорю».
  bytes node_identity_key = 13;

  // Unix-секунды выпуска и истечения снапшота. `expires_at` обязателен:
  // подписанный конфиг без срока — это предъявляемая вечно запись,
  // которую нечем отозвать. Клиент отвергает просроченный снапшот.
  uint64 issued_at = 14;
  uint64 expires_at = 15;

  // Адрес, по которому нода объявляет себя (`host:port`), если оператор
  // его задал. Пустая строка означает «нода адрес не объявляет» — читать
  // это как «подходит любой адрес» нельзя: нода слушает 0.0.0.0 и своего
  // публичного адреса в общем случае не знает.
  string advertised_address = 16;

  // Включена ли на этой ноде адресация по очередям (server-contract.md,
  // §6.8). `false` — нода принимает `ClientSend.queue_id`, но игнорирует
  // его, и доставка идёт по `recipient_id`; `true` — очередь определяет
  // получателя, а депозит в неизвестную, отозванную или истёкшую очередь
  // отвергается с `NO_PERMIT`.
  //
  // Клиенту это нужно знать до отправки: кадр «только по очереди», без
  // `recipient_id`, нода со снятым флагом считает неадресуемым и закрывает
  // сессию.
  bool supports_queue_addressing = 17;

  // Потолок срока жизни сертификата устройства в секундах; 0 — нода
  // делегированный вход не принимает. Клиенту это нужно знать до того, как
  // он положит сертификат в хендшейк: нода без поддержки поле не поймёт,
  // сверит статик с `identity_key` и оборвёт соединение.
  uint64 device_cert_max_ttl_secs = 18;

  // Нода понимает SetQueueOnly и применяет режим «только по очередям»
  // (server-contract.md, §6.9). Ставится, только когда включена адресация
  // по очередям: со снятой адресацией режим не действует, и нода отвечает
  // на SetQueueOnly отказом `UNSUPPORTED`.
  bool supports_queue_only = 19;

  // AllocateQueue понимает tag/expires_at/revoked, отзыв оставляет
  // надгробия, ListQueues их отдаёт, есть SetAccountRecord
  // (server-contract.md, §6.7). Не зависит от адресации по очередям.
  bool supports_derived_queues = 20;

  // `ClientSend.recipient_device_id` рядом с разрешённой очередью сужает
  // доставку до этого устройства владельца очереди (server-contract.md,
  // §6.8). Не зависит от адресации по очередям.
  bool supports_queue_device_scope = 21;

  // Нода понимает RevokeDeviceCerts и проверяет отзывы при делегированном
  // входе (server-contract.md, §6.10). Не зависит от адресации по очередям
  // и от `device_cert_max_ttl_secs`.
  bool supports_device_cert_revocation = 22;
  // New queue-addressed messages retain IncomingMessage.queue_id through
  // online/offline/replay delivery; a named recipient is checked against the
  // owner. Old stored records may have no provenance. Requires queue routing.
  bool supports_queue_provenance = 23;

  // Хранилище файлов (server-contract.md, §6.11). `false` — оператор его
  // выключил: кадры хранилища получают `UNSUPPORTED`, а остальные поля
  // `blob_*` равны нулю.
  bool supports_blobs = 24;
  // Потолок размера одного блоба, байт шифротекста. Больше — `TOO_LARGE`.
  uint64 blob_max_size = 25;
  // Потолок срока жизни блоба, секунды. Запрошенный срок нода зажимает им
  // и при загрузке, и при продлении; 0 в запросе — сам потолок.
  uint64 blob_max_ttl_secs = 26;
  // Максимум данных в одном `BlobUploadChunk.data` и `BlobData.data`, байт.
  // Вместе со служебными полями кадра всегда влезает в `max_frame_len`.
  uint64 blob_chunk_max = 27;
  // Сколько байт может храниться на один ящик или аккаунт: владельца
  // очереди для личных файлов, загрузившего — для своих.
  uint64 blob_quota_per_owner = 28;
  // Сколько байт нода отдаёт в ответ на один `BlobGet`. Более длинный
  // диапазон отдаётся началом этой длины, остальное клиент запрашивает
  // следующим `BlobGet`.
  uint64 blob_get_window = 29;
  // Минимальный учётный размер блоба, байт: в квотах (владельца, пары,
  // суточной) блоб считается не меньше чем за столько. Мелочь дешевле
  // отправить внутри сообщения. 0 — блоб считается по размеру.
  uint64 blob_min_charge = 30;

  // Нода выдаёт временные учётки STUN/TURN для звонков: `GetIceServers` →
  // `IceServers` (server-contract.md, §6.12). `false` — оператор не
  // настроил ни одного ICE-сервера, и запрос получит `NOT_CONFIGURED`.
  // Меняется без перезапуска ноды.
  bool supports_ice_servers = 31;

  // Номера 9–11 зарезервированы под удалённые поля версий клиента и ссылки
  // на обновление. Оператор ноды не должен влиять на дистрибуцию
  // клиентских бинарей: это забота вендорского подписанного манифеста, а
  // не конфига, подписанного ключом конкретной ноды.
  //
  // Резервируются и номера, и имена: номер защищает бинарное
  // представление, имя — JSON-представление схемы.
  reserved 9, 10, 11;
  reserved "min_supported_app_version", "latest_app_version", "update_url";
}

// Подписанный снапшот конфигурации. Подписываются именно те байты, что
// приехали в `config`, а не результат повторной сериализации: порядок полей
// в protobuf не канонизирован, и пересборка сообщения могла бы дать другие
// байты при том же смысле.
//
// Проверка на клиенте (все шаги обязательны):
//   1. birational-конверсия `node_identity_key` в X25519 равна статику,
//      с которым прошёл Noise-хендшейк;
//   2. `signature` — валидная Ed25519-подпись `node_identity_key` над
//      строкой `"trustmessage/server-config/v1" || config`;
//   3. `ServerConfig`, разобранный из `config`, не просрочен.
message SignedServerConfig {
  // Сериализованный ServerConfig.
  bytes config = 1;
  // Ed25519 public key ноды (32 байта).
  bytes node_identity_key = 2;
  // Ed25519-подпись (64 байта).
  bytes signature = 3;
}

// --- Control-канал: жизненный цикл mailbox-очередей ---
//
// Очередь — это адрес, по которому контакт кладёт депозит. Владелец
// заводит по одной очереди на контакт (и по одной на каждой из своих нод),
// передаёт контакту тройку `(адрес ноды, queue_id, ключ ноды)` вне этого
// протокола (например, в QR-коде), а блокировку контакта делает отзывом
// его очереди — спам отсекается на ноде, не доходя до клиента.
//
// Чего здесь намеренно нет и что устроено иначе, чем можно ожидать.
//
// **Нет `seq` и нет подписи владельца.** Кадры едут внутри установленной
// Noise-сессии: она уже аутентифицирована статиком клиента, упорядочена и
// защищена от реплея. Устройства одного аккаунта сходятся в состоянии
// очередей не через нумерацию кадров, а через детерминированные id и
// надгробия (см. ниже) и запись аккаунта с CAS по версии.
//
// **Нет `RotateQueue`, и нода не знает про поколения.** Ротация — клиентская
// процедура: завести новую очередь, сообщить её контакту, дать окно на
// переезд, отозвать старую. Эпохи — тоже дело клиента: он выводит из них
// разные теги, а нода видит только независимые теги и не может связать
// старый адрес с новым.
//
// **Клиент выбирает тег, но не id.** Идентификатор по-прежнему считает
// нода, и в нём владелец: `id = SHA-256("tm-queue-id-v1\0" ‖ owner ‖ tag)`.
// Поэтому чужой id тегом не назвать, пространство имён остаётся за нодой, а
// любое устройство аккаунта, знающее тег, выделяет ту же очередь. Тег ноде
// непрозрачен и ею не хранится. Без тега id — 32 байта из CSPRNG ноды.
//
// **Отзыв оставляет надгробие.** Отозванный id заново не выделяется
// (`REVOKED`), иначе устаревшее устройство вернуло бы заблокированному
// контакту доступ по старому адресу.
//
// **Запись аккаунта.** Маленькое непрозрачное значение (клиент шифрует в
// нём пул своих нод) с заменой по CAS версии: SetAccountRecord, чтение — в
// QueueList.

// Клиент → нода: завести очередь. Ответ — QueueAck с выданным id (в том
// числе для `revoked = true`: клиенту нужен id надгробия).
//
// Состояния id у владельца:
//   * нет — создать (потолок `MAX_QUEUES_PER_USER` → `LIMIT`); при
//     `revoked = true` — записать надгробие;
//   * живая — вернуть id, ничего не меняя (срок не перезаписывается, в
//     потолок повторно не считается); при `revoked = true` — перевести в
//     надгробие, как RevokeQueue;
//   * надгробие (в том числе истёкшая) — отказ `REVOKED`; при
//     `revoked = true` — вернуть id (идемпотентно).
message AllocateQueue {
  // 32 байта — детерминированное выделение:
  //   id = SHA-256("tm-queue-id-v1\0" ‖ owner_user_id(32) ‖ tag(32)).
  // Пусто — прежнее случайное выделение. Другая длина — INVALID.
  bytes tag = 1;
  // Unix-секунды; 0 — бессрочно. С этого момента очередь ведёт себя как
  // отозванная (надгробие с revoked_at = expires_at). Срок ≤ now — INVALID.
  // При revoked = true игнорируется.
  uint64 expires_at = 2;
  // true — сразу надгробие (затравка новой ноды пула отозванными
  // очередями). Только с тегом, иначе INVALID.
  bool revoked = 3;
}

// Клиент → нода: отозвать очередь. Депозиты в неё перестают приниматься;
// уже лежащее в ней доставляется обычным порядком. Очередь становится
// надгробием; повторный отзыв своего надгробия — `ok`.
message RevokeQueue {
  bytes queue_id = 1;
}

// Клиент → нода: перечислить свои очереди — живые и надгробия. Нужен
// после переустановки клиента и после потери его локального состояния:
// очередь, про которую знает только нода, иначе становится неотзываемой; а
// надгробия показывают другим устройствам аккаунта, какие очереди отозваны.
message ListQueues {}

// Нода → клиент: результат операции над очередью.
message QueueAck {
  bool ok = 1;
  // Заполнен только успешным `AllocateQueue` — это и есть выданный
  // идентификатор. У `RevokeQueue` пуст: подтверждать клиенту то, что он
  // сам прислал, незачем.
  bytes queue_id = 2;
  QueueRejectReason reason = 3;
}

message QueueRecord {
  bytes queue_id = 1;
  // Unix-секунды выдачи. Клиенту нужны, чтобы отличить свежую очередь от
  // забытой при сверке со своим состоянием. У надгробия — 0.
  uint64 created_at = 2;
  // 0 — живая; иначе Unix-секунды отзыва (надгробие). У истёкшей очереди —
  // её `expires_at`.
  uint64 revoked_at = 3;
  // 0 — бессрочная. У надгробия — 0.
  uint64 expires_at = 4;
}

// Нода → клиент: список очередей этого пользователя.
message QueueList {
  // Живые очереди и надгробия.
  repeated QueueRecord queues = 1;
  // Режим «только по очередям» этого аккаунта на этой ноде (SetQueueOnly).
  // Отражает сохранённый флаг, даже если адресация по очередям на ноде
  // сейчас выключена и режим поэтому не действует.
  bool queue_only = 2;
  // Запись аккаунта (SetAccountRecord) как есть; пусто — записи нет либо
  // она пуста (различает версия).
  bytes account_record = 3;
  // Версия записи аккаунта; 0 — записи нет.
  uint64 account_record_version = 4;
  // Действующие отзывы сертификатов устройств этого аккаунта на этой ноде
  // (RevokeDeviceCerts); устаревшие не отдаются.
  repeated DeviceCertRevocation device_cert_revocations = 5;
}

// Отзыв сертификатов одного устройства (в QueueList).
message DeviceCertRevocation {
  uint32 device_id = 1;
  uint64 issued_before = 2;
}

// Клиент → нода: включить или снять для своего аккаунта режим «только по
// очередям». Пока режим включён, нода отвергает `ClientSend` к этому
// аккаунту, если получатель определён по `recipient_id`, а не по очереди
// (`SendAck.reason = NO_PERMIT`); свои устройства аккаунта пишут себе
// свободно. Блокировка контакта при этом сводится к отзыву его очереди.
//
// Ответ — QueueAck (`queue_id` пуст). Требует права QUEUES у делегированной
// сессии. Идемпотентен. При выключенной адресации по очередям — отказ
// `UNSUPPORTED`, флаг не меняется (server-contract.md, §6.9).
message SetQueueOnly {
  bool enabled = 1;
}

// Клиент → нода: заменить запись аккаунта, если её текущая версия равна
// expected_version (0 — записи ещё нет). Новая версия — expected_version + 1.
// Не совпала — отказ `CONFLICT`, запись не меняется; из двух одновременных
// замен с одной ожидаемой версией проходит ровно одна. Ответ — QueueAck
// (`queue_id` пуст). Требует права QUEUES. Содержимое ноде непрозрачно
// (клиент шифрует), не длиннее 4 КиБ (иначе `INVALID`); пустая запись —
// обычное значение. Работает независимо от адресации по очередям.
message SetAccountRecord {
  bytes record = 1;
  uint64 expected_version = 2;
}

// Клиент → нода: отозвать сертификаты устройства своего аккаунта. После
// успеха нода не пускает делегированный вход этого устройства по
// сертификату с not_before < issued_before (AuthError 403) и закрывает
// такие живые сессии. Сессии, вошедшие ключом аккаунта, не затрагиваются.
// Ответ — QueueAck (queue_id пуст). Только сессия, вошедшая ключом
// аккаунта: делегированной — FORBIDDEN при любых битах scope. Идемпотентен;
// хранится максимум issued_before. Потолок действующих отзывов — LIMIT.
message RevokeDeviceCerts {
  // Устройство, как в DeviceCertificate.device_id; > 65535 — INVALID.
  uint32 device_id = 1;
  // Unix-секунды. 0 или больше now + 300 (допуск NOT_BEFORE_SKEW_SECS) —
  // INVALID. При `all = true` игнорируется.
  uint64 issued_before = 2;
  // true — отозвать все сертификаты устройства, в том числе выписанные
  // заранее с `not_before` в будущем: нода сама ставит issued_before = now +
  // горизонт по своим часам (горизонт — max(device_cert_max_ttl_secs,
  // 30 суток) + 300). До его наступления устройство не войдёт делегированно
  // ни по какому сертификату, в том числе выписанному после отзыва.
  bool all = 3;
}

// --- Хранилище файлов (server-contract.md, §6.11) ---
//
// Блоб — непрозрачные байты (шифротекст контейнера TMV1) с метаданными.
// Клиент загружает файл один раз, а в сообщении через очередь едет только
// E2E-указатель: `blob_secret`, адрес ноды и ключ файла. Нода хранит блоб под
// `blob_id = SHA-256(blob_secret)`; сам секрет знают только клиенты, и его
// предъявление — право на чтение. Хранимый id права не даёт, поэтому может
// попадать в имена файлов, надгробия и метрики.
//
// Байты блобов ходят только по сессии роли `BLOB` (см. SessionRole): так
// мегабайтные кадры не стоят в одном TCP-канале перед сообщениями.
// Сессия сообщений принимает из этих кадров только `BlobStat`.
//
// Ответ на любую операцию — `BlobAck` (на `BlobGet` — поток `BlobData`, на
// `BlobStat` — `BlobStatResult`). Отказ не рвёт сессию: разрыв — только на
// нарушение формата кадра.

// Состояние блоба в `BlobStatEntry`.
enum BlobState {
  BLOB_STATE_UNSPECIFIED = 0;
  // Загружен и проверен; можно скачивать.
  BLOB_STATE_READY = 1;
  // Загрузка не завершена.
  BLOB_STATE_UPLOADING = 2;
  // Надгробие: истёк срок. Отправителя можно попросить загрузить заново.
  BLOB_STATE_EXPIRED = 3;
  // Надгробие: удалён загрузившим. Просить заново не нужно — файл отозван.
  BLOB_STATE_DELETED = 4;
  // Не было, стёрт после релизов всеми читателями или надгробие истекло.
  BLOB_STATE_NOT_FOUND = 5;
  // Блоб живой, но токен управления не подошёл.
  BLOB_STATE_FORBIDDEN = 6;
}

// Причина отказа в `BlobAck`. Как и у `SendRejectReason`, пара `ok = false,
// reason = UNSPECIFIED` читается как родовой отказ.
enum BlobRejectReason {
  BLOB_REJECT_REASON_UNSPECIFIED = 0;
  // Блоба нет и не было, стёрт после релизов всеми читателями, его
  // надгробие истекло или незавершённая загрузка протухла. Неверный
  // `blob_secret` неотличим от несуществующего блоба.
  BLOB_REJECT_REASON_NOT_FOUND = 1;
  // Истёк срок (надгробие). Можно попросить отправителя перезалить.
  BLOB_REJECT_REASON_EXPIRED = 2;
  // Токен управления не подошёл; очередь получателя неизвестна, отозвана
  // или истекла; загрузку дописывает не загрузивший; делегированной сессии
  // не хватает права SEND.
  BLOB_REJECT_REASON_FORBIDDEN = 3;
  // `size` больше `ServerConfig.blob_max_size`.
  BLOB_REJECT_REASON_TOO_LARGE = 4;
  // Квота ящика, пары «загрузивший → владелец», суточный объём загрузок
  // пользователя или резерв диска ноды.
  BLOB_REJECT_REASON_QUOTA = 5;
  // Превышен rate-limit операций хранилища. Повтор через секунду осмыслен.
  BLOB_REJECT_REASON_RATE_LIMITED = 6;
  // Негодные параметры: длины полей, смещение не там (с актуальным
  // `committed_offset`), диапазон за пределами блоба, размер или SHA-256
  // при `Commit` не сошлись (блоб тогда удалён).
  BLOB_REJECT_REASON_INVALID = 7;
  // Операция над блобом, загрузка которого не завершена.
  BLOB_REJECT_REASON_NOT_READY = 8;
  // Хранилище выключено оператором либо кадр пришёл в сессию не той роли.
  BLOB_REJECT_REASON_UNSUPPORTED = 9;
  // Ошибка ноды: диск, база. Повтор через паузу осмыслен.
  BLOB_REJECT_REASON_INTERNAL = 10;
  // Удалён загрузившим (надгробие). Просить заново не нужно.
  BLOB_REJECT_REASON_DELETED = 11;
  // `BlobUploadInit`: `blob_id` уже занят — живым блобом или надгробием.
  BLOB_REJECT_REASON_CONFLICT = 12;
}

// Клиент → нода: начать загрузку. Ответ — `BlobAck` с `blob_id`,
// `committed_offset = 0` и предварительным `expires_at`.
message BlobUploadInit {
  // 32 байта — личный файл (scope RECIPIENT): кладётся в ящик владельца
  // этой очереди и считается его квотой; нужна живая очередь, как для
  // депозита. Пусто — свой файл (scope OWN): группы и свои устройства,
  // квота загрузившего. Другая длина — INVALID.
  bytes queue_id = 1;
  // Размер шифротекста, байт; > 0 и не больше `blob_max_size`. Квоты
  // резервируются по нему сразу.
  uint64 size = 2;
  // SHA-256 шифротекста (32 байта); нода сверяет при `BlobUploadCommit`.
  bytes sha256 = 3;
  // Срок жизни после `Commit`, секунды. 0 — потолок ноды; больше потолка
  // — зажимается им.
  uint64 ttl_seconds = 4;
  // Сколько разных устройств (`user_id`, `device_id`) должны отпустить
  // блоб `BlobRelease`, чтобы нода его стёрла. 0 — только срок. Не больше
  // 256, иначе INVALID.
  uint32 max_releases = 5;
  // SHA-256(blob_secret), 32 байта. Занят живым блобом или надгробием —
  // CONFLICT. Связь id с секретом нода проверить не может: неверный id
  // вредит только загрузившему.
  bytes blob_id = 6;
  // SHA-256 токена управления (32 байта). Сам токен — у отправителя; им
  // блоб удаляют и продлевают.
  bytes delete_token_hash = 7;
  uint64 request_id = 8;
}

// Клиент → нода: очередной кусок загрузки. Принимается только со
// смещения, которое нода ждёт (последовательно, без дыр); иначе `BlobAck`
// INVALID с ожидаемым `committed_offset`. Ответа на каждый кусок нет:
// прогресс приходит `BlobAck` (`ok = true`, `request_id = 0`, `blob_id`,
// `committed_offset`) после каждого сброса на диск и после последнего
// куска. Отказы по кускам тоже несут `request_id = 0` и `blob_id`.
message BlobUploadChunk {
  bytes blob_id = 1;
  uint64 offset = 2;
  // Не пусто и не длиннее `ServerConfig.blob_chunk_max`.
  bytes data = 3;
}

// Клиент → нода: загрузка закончена. Размер и SHA-256 сошлись — блоб READY,
// `BlobAck` несёт окончательный `expires_at`. Иначе INVALID, и блоб
// удаляется без надгробия.
message BlobUploadCommit {
  bytes blob_id = 1;
  uint64 request_id = 2;
}

// Клиент → нода: где остановилась загрузка (докачка после разрыва).
// `BlobAck.committed_offset` — сколько байт сброшено на диск; с него и
// продолжать.
message BlobUploadStatus {
  bytes blob_id = 1;
  uint64 request_id = 2;
}

// Клиент → нода: скачать диапазон. Ответ — поток `BlobData` с тем же
// `request_id`; отказ (в том числе посреди потока, если блоб удалили или он
// истёк) — `BlobAck`. Срок и счётчик релизов не меняются.
message BlobGet {
  // 32 байта. Нода считает SHA-256 и ищет блоб по нему.
  bytes blob_secret = 1;
  uint64 offset = 3;
  // 0 — до конца блоба. Ответ не длиннее `ServerConfig.blob_get_window`.
  // Диапазон за пределами блоба — INVALID.
  uint64 length = 4;
  uint64 request_id = 5;
}

// Клиент → нода: файл получен и проверен, этому устройству он больше не
// нужен. Учитывается один раз на (`user_id`, `device_id`) сессии; повтор —
// `ok`. Когда отпустили `max_releases` устройств, блоб стирается (дальше —
// NOT_FOUND).
message BlobRelease {
  bytes blob_secret = 1;
  uint64 request_id = 3;
}

// Клиент → нода: удалить блоб (только загрузивший — по токену управления).
// Разрешено в любом состоянии: загрузка обрывается, файл стирается, идущие
// скачивания прерываются `BlobAck` DELETED. Остаётся надгробие DELETED.
// Повтор с верным токеном — `ok`, с неверным — FORBIDDEN.
message BlobDelete {
  bytes blob_id = 1;
  bytes delete_token = 2;
  uint64 request_id = 3;
}

// Клиент → нода: продлить срок готового блоба: `expires_at = now +
// min(ttl_seconds, потолок)`; 0 — потолок.
message BlobExtend {
  bytes blob_id = 1;
  bytes delete_token = 2;
  uint64 ttl_seconds = 3;
  uint64 request_id = 4;
}

// Одна запись `BlobStat`: ровно одно из — `blob_secret` (читатель) или
// `blob_id` + `delete_token` (загрузивший).
message BlobStatQuery {
  bytes blob_secret = 1;
  bytes blob_id = 2;
  bytes delete_token = 3;
}

// Клиент → нода: проверить наличие пачкой, ничего не меняя. Принимается в
// сессиях обеих ролей. Больше 64 записей или негодная запись — `BlobAck`
// INVALID на весь запрос.
message BlobStat {
  repeated BlobStatQuery items = 1;
  uint64 request_id = 2;
}

// Нода → клиент: исход операции хранилища.
message BlobAck {
  uint64 request_id = 1;
  bool ok = 2;
  BlobRejectReason reason = 3;
  // Init, Status, прогресс и отказы по `BlobUploadChunk`.
  bytes blob_id = 4;
  // Init, Status, прогресс загрузки; при INVALID по смещению — с какого
  // смещения нода ждёт следующий кусок.
  uint64 committed_offset = 5;
  // Init (предварительный), Commit, Extend, Status: срок после зажима,
  // Unix-секунды.
  uint64 expires_at = 6;
}

// Нода → клиент: кусок ответа на `BlobGet`.
message BlobData {
  uint64 request_id = 1;
  // Смещение куска в блобе.
  uint64 offset = 2;
  // Не длиннее `ServerConfig.blob_chunk_max`.
  bytes data = 3;
  // Последний кусок этого ответа. Блоб получен целиком, когда
  // `offset + len(data)` равно его размеру.
  bool eof = 4;
}

message BlobStatEntry {
  BlobState state = 1;
  // READY — срок блоба; UPLOADING — когда незавершённая загрузка будет
  // удалена, если её не продолжить. Иначе 0.
  uint64 expires_at = 2;
  // Только для запроса по токену управления (видит лишь загрузивший).
  uint32 releases_done = 3;
  uint32 max_releases = 4;
}

// Нода → клиент: ответ на `BlobStat`; порядок записей — порядок `items`.
message BlobStatResult {
  uint64 request_id = 1;
  repeated BlobStatEntry entries = 2;
}

message Ping {}

message Pong {}

// Запрос ICE-серверов перед звонком (server-contract.md, §6.12). Только в
// сессии сообщений.
message GetIceServers {}

// Ответ на `GetIceServers`.
message IceServers {
  // Серверы для `RTCPeerConnection.iceServers`. Пусто при отказе.
  repeated IceServer servers = 1;
  // Unix-секунды, после которых учётки TURN не действуют. Звонок, который
  // идёт через TURN дольше, клиент продлевает ICE restart со свежими
  // учётками.
  uint64 expires_at = 2;
  // `ICE_REJECT_REASON_UNSPECIFIED` — учётки выданы.
  IceRejectReason reason = 3;
}

message IceServer {
  // `stun:`, `stuns:`, `turn:` или `turns:` URL.
  repeated string urls = 1;
  // Пусто у STUN. У TURN — `<expires_at>:<псевдоним>`: псевдоним
  // постоянен для пользователя на этой ноде и не раскрывает его ключ.
  string username = 2;
  // Пусто у STUN. У TURN — пароль по схеме coturn REST.
  string credential = 3;
}

enum IceRejectReason {
  ICE_REJECT_REASON_UNSPECIFIED = 0;
  // Оператор не настроил ICE-серверы.
  ICE_REJECT_REASON_NOT_CONFIGURED = 1;
  // Слишком часто: общий лимит управляющих кадров сессии.
  ICE_REJECT_REASON_RATE_LIMITED = 2;
}

// Универсальный конверт. Ровно один вариант `payload` на кадр. Кадр без
// payload или с вариантом, который нода не обрабатывает, — не ошибка
// формата: нода его игнорирует, что оставляет место для расширений.
message Frame {
  uint32 proto_version = 1;

  oneof payload {
    AuthOk auth_ok = 2;
    AuthError auth_error = 3;
    ClientSend client_send = 4;
    SendAck send_ack = 5;
    IncomingMessage incoming = 6;
    Ping ping = 7;
    Pong pong = 8;
    DeliveryAck delivery_ack = 9;
    GetServerConfig get_server_config = 10;
    SignedServerConfig signed_server_config = 11;
    RegisterPushToken register_push_token = 12;
    UnregisterPushToken unregister_push_token = 13;
    PushTokenAck push_token_ack = 14;
    AllocateQueue allocate_queue = 15;
    RevokeQueue revoke_queue = 16;
    ListQueues list_queues = 17;
    QueueAck queue_ack = 18;
    QueueList queue_list = 19;
    SetQueueOnly set_queue_only = 20;
    SetAccountRecord set_account_record = 21;
    RevokeDeviceCerts revoke_device_certs = 22;
    BlobUploadInit blob_upload_init = 23;
    BlobUploadChunk blob_upload_chunk = 24;
    BlobUploadCommit blob_upload_commit = 25;
    BlobUploadStatus blob_upload_status = 26;
    BlobGet blob_get = 27;
    BlobRelease blob_release = 28;
    BlobDelete blob_delete = 29;
    BlobExtend blob_extend = 30;
    BlobStat blob_stat = 31;
    BlobAck blob_ack = 32;
    BlobData blob_data = 33;
    BlobStatResult blob_stat_result = 34;
    GetIceServers get_ice_servers = 35;
    IceServers ice_servers = 36;
  }
}
