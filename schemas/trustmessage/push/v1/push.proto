// Контракт «нода → push-шлюз». Отдельный сервис, отдельный транспорт: это
// не часть клиентского wire-протокола, и внутри Noise-канала он не едет.
//
// Назначение. Без шлюза нода держит на диске service-account FCM и
// .p8-ключ APNs. Вендорские креды нельзя выдать стороннему оператору ноды,
// а без них её пользователи не получают пуши. Шлюз разрывает эту связку:
// креды остаются у владельца приложения, будить умеет любая нода.
//
// Что шлюз узнаёт и чего не узнаёт. Не узнаёт: содержимое переписки,
// отправителя, размер сообщения. Узнаёт: push-токен получателя, тайминги
// пробуждений и — для wake — идентификатор получателя, потому что клиент
// по нему выбирает аккаунт для дренажа. Это осознанная цена
// централизованного будильника; убрать `recipient_user` из запроса
// позволит только регистрация токенов по очередям вместо пользователя.
//
// Модель доверия. Подпись node-ключом не является capability на
// пробуждение: реестра нод у шлюза нет, и проверить, «своя» ли нода, он не
// может. Реальная capability — знание push-токена, а подпись даёт лишь
// самосогласованность запроса и стабильный ключ для rate-limit'а (шлюз
// узнаёт ключ ноды из её первого запроса). Следствие принимается явно:
// нода, которой пользователь доверил токен, владеет будильником его
// устройства; ответ на компрометацию — ротация токена клиентом.

syntax = "proto3";

package trustmessage.push.v1;

// Максимальный приоритет накопленного за окно коалесинга. Шлюз использует
// его ровно для одного: маршрутизации `apns-priority`. Номера — как в
// `trustmessage.wire.v1.MessagePriority`.
enum MessagePriority {
  MESSAGE_PRIORITY_UNSPECIFIED = 0;
  MESSAGE_PRIORITY_LOW = 1;
  MESSAGE_PRIORITY_MEDIUM = 2;
  MESSAGE_PRIORITY_HIGH = 3;
}

// Разновидность wake'а. `WELCOME` — единственный случай, когда пуш несёт
// видимый пользователю notification-блок; всё остальное data-only.
enum WakeKind {
  WAKE_KIND_UNSPECIFIED = 0;
  WAKE_KIND_WAKE = 1;
  WAKE_KIND_WELCOME = 2;
}

// Исход отправки. Значения обязаны покрывать все ветки, которые нода умеет
// различать сама при прямой работе с FCM/APNs, — иначе переезд на шлюз
// молча ухудшил бы поведение: невалидный токен перестал бы вычищаться, а
// перегрузка провайдера — тормозить ретраи.
enum DeliveryStatus {
  // Родовой отказ. Читается нодой как транзиентная ошибка: повторить с
  // backoff, токен не трогать. Сюда же попадает незнакомое значение от
  // более свежего шлюза — поэтому «неизвестно» обязано быть безопасным.
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_OK = 1;
  // Провайдер сказал, что токен мёртв (`UNREGISTERED`, `BadDeviceToken`,
  // `DeviceTokenNotForTopic`…). Нода немедленно снимает слот: держать его
  // дальше — это гарантированно бесполезные запросы до конца жизни записи.
  DELIVERY_STATUS_INVALID_TOKEN = 2;
  // Квота провайдера или самого шлюза. Экспоненциальный backoff.
  DELIVERY_STATUS_QUOTA = 3;
  // 5xx от провайдера.
  DELIVERY_STATUS_PROVIDER_ERROR = 4;
  // Шлюз не смог дотянуться до провайдера (сеть, таймаут).
  DELIVERY_STATUS_UNAVAILABLE = 5;
}

// Содержимое подписываемых байтов wake-запроса. На проводе едет
// сериализованным внутри `WakeRequest.wake`; подписываются именно те
// байты, что приехали, а не результат повторной сериализации: порядок
// полей в protobuf не канонизирован.
message Wake {
  // Registration token FCM.
  //
  // Платформы в запросе нет намеренно. Провайдера выбирает метод: alert-слот
  // всегда уходит через FCM, voip-слот — через APNs методом `Ring`. Внутри
  // FCM-конверта нода заполняет оба блока, `android` и `apns`, не глядя на
  // платформу токена: провайдер сам знает, чей это токен. Поле, которое
  // всегда было бы `UNSPECIFIED`, вводило бы читателя схемы в заблуждение.
  string token = 1;
  WakeKind kind = 2;
  // Сколько недоставленных накопилось с прошлого пуша. Число сообщений, не
  // их содержимое.
  uint32 pending = 3;
  MessagePriority max_priority = 4;
  // Серверное «сейчас» в момент решения. Клиент оценивает по нему
  // свежесть пуша.
  uint64 server_ts_secs = 5;
  // 32 байта Ed25519 pk получателя. Единственное поле, раскрывающее шлюзу
  // личность получателя (см. описание в начале файла).
  bytes recipient_user = 6;
  // `device_id` устройства, на которое зарегистрирован токен. Регистрация
  // токена требует device_id, поэтому значение есть всегда; 0 — обычный
  // идентификатор устройства, а не «не задан».
  uint32 recipient_device = 7;
  // Момент выпуска запроса и одноразовый nonce (16 байт). Шлюз держит
  // короткое окно виденных nonce: без него перехваченный запрос
  // переигрывается сколько угодно раз, а звонок — это ещё и звук у
  // получателя.
  uint64 issued_at_secs = 8;
  bytes nonce = 9;
}

// Содержимое подписываемых байтов ring-запроса.
//
// Заметно беднее `Wake`, и это не упущение: APNs voip-payload
// content-free by design (`{"aps":{}}`), кто звонит — клиент узнаёт только
// после дренажа своего mailbox'а. Раз в полезной нагрузке получателя нет,
// незачем и сообщать его шлюзу: у того остаётся только токен.
message Ring {
  // PushKit voip-токен устройства. Это другой токен, не равный
  // FCM/APNs-токену того же устройства.
  string token = 1;
  uint64 server_ts_secs = 2;
  // Сколько секунд ring имеет смысл (`apns-expiration`). Ноль означает
  // «шлюз решает сам» — у ноды нет причин навязывать своё значение, если
  // оператор шлюза знает лучше.
  uint32 expiration_secs = 3;
  uint64 issued_at_secs = 4;
  bytes nonce = 5;
}

// Wake на проводе: подписанный конверт.
message WakeRequest {
  // Сериализованный `Wake`.
  bytes wake = 1;
  // Ed25519 pk ноды (32 байта) — тот же ключ, что нода предъявляет
  // клиентам как `node_identity_key`.
  bytes node_key = 2;
  // Ed25519-подпись (64 байта) над
  // `"trustmessage/push-gateway/v1" || wake`.
  bytes signature = 3;
}

message WakeResponse {
  DeliveryStatus status = 1;
  // Диагностика для логов. Логику на неё завязывать нельзя: текст не
  // является частью контракта.
  string detail = 2;

  // Подсказки «повторить не раньше» нет намеренно: нода применяет
  // собственную экспоненциальную супрессию (по умолчанию от 30 с до 1 ч),
  // интервал которой хранится в её `PushState`. Поле, которое контракт
  // объявляет, а получатель игнорирует, хуже отсутствующего; схема
  // аддитивна, и его можно добавить, когда нода начнёт его учитывать.
}

// Ring на проводе: подписанный конверт.
message RingRequest {
  // Сериализованный `Ring`.
  bytes ring = 1;
  bytes node_key = 2;
  // Подпись над `"trustmessage/push-gateway/v1" || ring`. Домен тот же,
  // что у wake: разделяет их не строка, а вызванный метод.
  bytes signature = 3;
}

message RingResponse {
  DeliveryStatus status = 1;
  string detail = 2;
}

// Шлюз пробуждения. Обе операции идемпотентны в смысле «повтор безвреден»,
// но не по эффекту: повторный wake — это второй пуш. Дедупликацию по
// `nonce` держит шлюз, а не нода.
service PushGatewayService {
  // Обычное пробуждение через FCM.
  rpc Wake(WakeRequest) returns (WakeResponse);
  // APNs voip-ring для входящего звонка. Минует коалесинг на ноде и не
  // должен коалесироваться на шлюзе — только подавляться cooldown-окном
  // на один токен.
  rpc Ring(RingRequest) returns (RingResponse);
}
