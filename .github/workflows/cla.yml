# Подпись CLA (CLA.md) при первом pull request'е автора.
#
# pull_request_target даёт токен с правом записи и для PR из форков, поэтому
# job не выкачивает и не запускает код из PR: работает только action, который
# читает комментарии и пишет подписи в ветку cla-signatures.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Darkildo/trust_message_tcp-public/blob/master/CLA.md
          # При изменении текста CLA — новая версия пути, чтобы старые
          # подписи не засчитывались за новый текст.
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: Darkildo,dependabot[bot]
