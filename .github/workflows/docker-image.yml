name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: trust_message_tcp:ci

      - name: Save binary artifact
        run: |
          id="$(docker create trust_message_tcp:ci)"
          docker cp "$id:/usr/local/bin/trust_message_tcp" trust_message_tcp
          docker rm "$id"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server
          path: trust_message_tcp

  publish:
    needs: build
    # Образ публикуется только из master: PR-сборка не должна перезаписывать `latest`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: lower
        name: Normalize registry owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.lowercase }}/tcp_message_server:latest
