# Проверка зависимостей по базе RustSec.
#
# Отдельно от ci.yml ради расписания: advisory публикуются без всяких
# изменений в коде, и уязвимость в уже влитом Cargo.lock иначе всплыла бы
# только на следующем PR.
name: Audit

on:
  push:
    branches: ["master", "dev", "stable"]
  pull_request:
    branches: ["master", "dev", "stable"]
  schedule:
    # Каждый день в 03:30 UTC, после ночного фаззинга.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      # Уязвимость валит проверку; предупреждения (unmaintained, unsound,
      # yanked) только печатаются: fxhash и instant тянет sled 0.34, и без
      # замены хранилища их не убрать.
      - name: Server
        run: cargo audit

      - name: Fuzz crate
        run: cargo audit --file fuzz/Cargo.lock
