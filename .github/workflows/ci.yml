# Гейты, которые обязаны держать инварианты, зафиксированные в docs/:
# формат, отсутствие clippy-предупреждений, тесты, совместимость схемы,
# покрытие изменённого кода и smoke-фаззинг разборщиков.
#
# Сборка образа живёт в docker-image.yml и здесь не дублируется.
#
# Сторонние actions здесь и в соседних workflow закреплены SHA коммита
# (комментарий — версия): тег можно перевесить, коммит — нет. Обновляет их
# dependabot, см. .github/dependabot.yml.
name: CI

on:
  push:
    branches: ["master", "dev", "stable"]
  pull_request:
    branches: ["master", "dev", "stable"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NATS_VERSION: v2.12.6
  # SHA256 из SHA256SUMS официального релиза nats-server.
  NATS_SHA256: 77fe7dd69ff5144126026b78355900be0ab0bb4339dc61a7621dcc9b9e9d07a6

jobs:
  check:
    name: fmt / clippy / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Версии rust-toolchain — не теги, а ветки-каналы (`stable`,
      # `nightly`), и они двигаются: пин — коммит master, а канал задаётся
      # входом `toolchain`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      # Базовая линия clippy — ноль предупреждений, без списка исключений.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  jetstream:
    name: delivery over JetStream
    runs-on: ubuntu-latest
    # Брокерный тракт — единственная часть доставки, которую нельзя
    # проверить в процессе: передоставка, снятие конверта по подтверждению
    # и терминация неразбираемого конверта существуют только в связке с
    # живым потоком.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Бинарь, а не контейнер: один из тестов поднимает и убивает
      # собственный брокер, и ему нужен исполняемый файл под рукой.
      - name: Install NATS server
        run: |
          archive="nats-server-$NATS_VERSION-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nats-io/nats-server/releases/download/$NATS_VERSION/$archive"
          echo "$NATS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nats-bin"
          tar xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/nats-bin" --wildcards '*/nats-server'
          echo "$RUNNER_TEMP/nats-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nats-bin/nats-server" --version

      - name: Start NATS with JetStream
        run: |
          nats-server -js -sd "$RUNNER_TEMP/nats" > "$RUNNER_TEMP/nats.log" 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q "Server is ready" "$RUNNER_TEMP/nats.log" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "NATS did not become ready"
          cat "$RUNNER_TEMP/nats.log"
          exit 1

      # --test-threads=1: поток в JetStream один на все тесты (два потока
      # не могут делить subject), параллельные прогоны спорили бы за него.
      - name: Delivery tests
        env:
          TRUST_MESSAGE_TEST_NATS_URL: nats://127.0.0.1:4222
          TRUST_MESSAGE_TEST_NATS_BIN: nats-server
        run: cargo test --test jetstream_delivery -- --ignored --test-threads=1

  schema:
    name: buf lint / breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # buf breaking сравнивает с master — нужна история, а не срез.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        working-directory: schemas
        run: buf lint

      # Переиспользованный номер поля ломает клиентов молча — единственное
      # место, где это ловится автоматически.
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        working-directory: schemas
        run: buf breaking --against '../.git#branch=master,subdir=schemas'

  coverage:
    name: coverage of changed files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Брокерные тесты помечены `#[ignore]`, и без них замер врёт: код
      # пула доставки выглядит непокрытым ровно потому, что проверяющие
      # его тесты не запущены.
      - name: Install NATS server
        run: |
          archive="nats-server-$NATS_VERSION-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nats-io/nats-server/releases/download/$NATS_VERSION/$archive"
          echo "$NATS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nats-bin"
          tar xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/nats-bin" --wildcards '*/nats-server'
          echo "$RUNNER_TEMP/nats-bin" >> "$GITHUB_PATH"

      - name: Start NATS with JetStream
        run: |
          nats-server -js -sd "$RUNNER_TEMP/nats" > "$RUNNER_TEMP/nats.log" 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q "Server is ready" "$RUNNER_TEMP/nats.log" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "NATS did not become ready"
          cat "$RUNNER_TEMP/nats.log"
          exit 1

      - name: Collect coverage
        env:
          TRUST_MESSAGE_TEST_NATS_URL: nats://127.0.0.1:4222
          TRUST_MESSAGE_TEST_NATS_BIN: nats-server
        run: |
          cargo llvm-cov --all-targets --json --output-path coverage.json \
            -- --include-ignored --test-threads=1

      - name: Gate changed files
        run: |
          python3 scripts/coverage-gate.py \
            coverage.json \
            "origin/${{ github.base_ref }}" \
            --min 70

  fuzz:
    name: smoke fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Таргет задаётся явно: санитайзер несовместим со статически
      # слинкованным libc, а cargo-fuzz на этом раннере по умолчанию
      # берёт musl и падает на `sanitizer is incompatible with statically
      # linked libc`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz

      # Короткий прогон: цель не «найти всё», а не пустить в master
      # разборщик, падающий на первых же случайных байтах. Настоящий
      # фаззинг — долгий и живёт в nightly-fuzz.yml.
      #
      # fuzz/seeds — фиксированный набор валидных кадров. Он не ускоряет
      # поиск (замерено: покрытие насыщается за секунды в обоих случаях),
      # но делает короткий прогон детерминированным: регрессия, ломающая
      # разбор валидного кадра, падает сразу, а не с какой-то
      # вероятностью.
      - name: Fuzz parsers
        run: |
          for target in frame_decode chunk_framing client_hello signed_server_config; do
            echo "::group::$target"
            # Корпус в .gitignore (он растёт и живёт в кэше), а libFuzzer
            # требует, чтобы каталог для новых входов уже существовал.
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -dict=fuzz/proto.dict -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
