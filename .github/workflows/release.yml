# Релиз по тегу vX.Y.Z: бинари tmnode для установщика и версионные теги
# образа ноды. Из них `install.sh` админки и `tmnode install` ставят ноду
# на чистый сервер (docs/agent-protocol.md).
#
# Тег ставится на коммит master, уже прошедший CI (порядок релиза — в
# docs/deployment.md): образ этого коммита к моменту тега опубликован
# docker-image.yml, здесь ему только добавляются теги.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tmnode:
    name: tmnode ${{ matrix.arch }}
    # Ubuntu 22.04 — glibc 2.35: бинарь запускается на Debian 12 и
    # Ubuntu 22.04+. Каждая архитектура собирается на своём раннере: так не
    # нужна кросс-сборка C-части rustls (aws-lc).
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked -p tmnode

      # Версия tmnode — версия релиза: по ней агент находит бинарь
      # (`<релизы>/v<tmnode.version>/`) и сверяет `tmnode version`.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/tmnode "dist/tmnode-${{ matrix.arch }}-linux"
          printed="$("dist/tmnode-${{ matrix.arch }}-linux" version)"
          echo "$printed"
          if [ "$printed" != "tmnode ${TAG#v}" ]; then
            echo "tmnode печатает «$printed», а тег — $TAG: поднимите [workspace.package] version"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmnode-${{ matrix.arch }}
          path: dist/

  publish:
    name: GitHub Release
    needs: tmnode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tmnode-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum tmnode-* > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Нода $TAG. Изменения — CHANGELOG.md; установка — docs/tmnode.md."

  image:
    name: Image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тот же образ, что собран из коммита тега, получает имя версии и
      # `stable` — без пересборки: в релиз уходит ровно то, что прошло CI.
      - name: Tag the commit image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Тег ставится сразу после fast-forward master, а образ коммита
          # docker-image.yml публикует несколько минут спустя: ждём его.
          for attempt in $(seq 1 60); do
            docker buildx imagetools inspect "$image:$GITHUB_SHA" >/dev/null 2>&1 && break
            if [ "$attempt" = 60 ]; then
              echo "образ $image:$GITHUB_SHA не появился за 30 минут: тег не на коммите master?"
              exit 1
            fi
            sleep 30
          done
          docker buildx imagetools create \
            --tag "$image:$TAG" \
            --tag "$image:stable" \
            "$image:$GITHUB_SHA"
